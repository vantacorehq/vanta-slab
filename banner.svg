<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>crossmem-relational banner</title>
<desc>Relational checker: pairs of memory operations, not single instructions</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="300" fill="#0a0e12"/>
<rect width="1200" height="300" fill="url(#grid)"/>

<g font-family="monospace" font-size="13">
  <circle cx="110" cy="100" r="7" fill="#a78bfa"/>
  <text x="110" y="128" text-anchor="middle" fill="#a78bfa">W (plain)</text>
  <circle cx="110" cy="200" r="7" fill="#34d399"/>
  <text x="110" y="228" text-anchor="middle" fill="#34d399">S (release)</text>
  <line x1="110" y1="107" x2="110" y2="193" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="155" fill="#64748b">MUST</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
</g>

<text x="260" y="130" fill="#f1f5f9" font-family="monospace" font-size="46" font-weight="700">crossmem-relational</text>
<text x="262" y="168" fill="#64748b" font-family="monospace" font-size="16">pairs, not instructions &#183; spec-first &#183; bounded soundness proof</text>

<rect x="262" y="195" width="130" height="26" rx="4" fill="none" stroke="#a78bfa"/>
<text x="327" y="212" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">spec-only</text>
<rect x="404" y="195" width="150" height="26" rx="4" fill="none" stroke="#64748b"/>
<text x="479" y="212" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">no implementation</text>
<rect x="564" y="195" width="150" height="26" rx="4" fill="none" stroke="#64748b"/>
<text x="639" y="212" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">x86-64 only</text>
</svg>
